<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Date time</h1>
    <form action="" name="dateform">
         <input type="date" name="date"> <br> <br>
         <button type="button" onclick="datetime()">Clik</button>
         </form>
 <script>
    
    function datetime(){
         let dateday = document.dateform.date.value;
         let day = new Date(dateday);
         let d = day.getDay();
         alert(d);
    }
 </script>
</body>
</html>
