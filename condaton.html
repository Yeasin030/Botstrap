<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let mcq = Number(prompt('Enter Your MCQ Number : '))
        let descriptive = Number(prompt('Enter Your Descriptive Number : '))
        let Evidence = Number(prompt('Enter Your Evidence Number : '))


        if (mcq>=80 && descriptive>=60 && Evidence>=60){   
            document.write("You are Pass");
        }
        else{
            document.write("You are Fail");
        }
    </script>
</body>
</html>
